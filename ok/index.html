<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="img/favicon.ico">
    <title>Links</title>
</head>
<body>
    <h1>Título de exemplo</h1>
    <h2>Subtítulo</h2>
    <img src="img/favicon.ico" alt="imagem">
    <p>Texto de <def title="definição de exemplo">exemplo</def>, <b></b>texto importante aqui</b>, ok acabou.</p>
    <h2>Links</h2>
    <ul>
        <li><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="nofollow">Robux grátis</a>
        <li><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="nofollow">Vbucks gratuítos</a>    
    </ul>

    <h2>Vídeo interno</h2>

    <video controls>
        <source src="midia/shrek_crusaders.mp4" type="video/mp4">
    </video>

    <h2>Vídeo externo</h2>

    <iframe 
        width="560"
        height="315"
        src="https://www.youtube-nocookie.com/embed/Az5IVWIkZvo?si=JIWAAgYrJ2jldC_E"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="favicon" href="img/favicon.ico">
  <title>Loja Pro</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">LojaPro</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Produtos</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Os melhores produtos você encontra aqui</h1>
    <p>Qualidade, preço justo e entrega rápida</p>
    <button>Ver Produtos</button>
  </section>

  <!-- PRODUTOS -->
  <div class="container">
    <h2 class="section-title">Produtos em destaque</h2>

    <div class="products">

      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="">
        <div class="card-body">
          <h3>Notebook Gamer</h3>
          <div class="price">R$ 4.999</div>
          <button>Comprar</button>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="">
        <div class="card-body">
          <h3>Placa de Vídeo</h3>
          <div class="price">R$ 2.499</div>
          <button>Comprar</button>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="">
        <div class="card-body">
          <h3>Teclado Mecânico</h3>
          <div class="price">R$ 299</div>
          <button>Comprar</button>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="">
        <div class="card-body">
          <h3>Mouse Gamer</h3>
          <div class="price">R$ 199</div>
          <button>Comprar</button>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <h3>LojaPro</h3>
    <p>© 2026 - Todos os direitos reservados</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-b4">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 5</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmasculino" value="M"><label for="isxmasculino">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfeminino" value="F"><label for="isxfeminino">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esporte</legend>
            <input type="checkbox" name="esfutebol" id="iesfutebol"> <label for="iesfutebol">Futebol</label> <br>
            <input type="checkbox" name="esbasquete" id="iesbasquete"> <label for="iesbasquete">Basquete</label> <br>
            <input type="checkbox" name="esbeisebol" id="iesbeisebol"> <label for="iesbeisebol">Beisebol</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
